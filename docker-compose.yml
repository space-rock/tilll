# Tilll and its data. Settings come from .env (made by `pnpm tilll init`); nothing secret is in this file or in the image.
services:
  tilll:
    build: .
    image: tilll:local
    env_file: .env
    environment:
      # Inside the container: the port the server listens on, and where the database lives (the volume below).
      PORT: "8080"
      DATA_DIR: /app/data
    ports:
      # The host port is PORT from .env (default 8080). Bound to this machine only; put a reverse proxy with https in front to publish it.
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - tilll-data:/app/data
    # Lets WEBHOOK_URL=http://host.docker.internal:9000/hooks/tilll reach a receiver running on this machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  tilll-data:
